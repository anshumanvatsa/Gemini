services:
  - type: web
    name: previral-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
    staticPublishPath: frontend
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
